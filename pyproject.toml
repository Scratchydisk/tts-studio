[project]
name = "tts-studio"
version = "0.2.0"
description = "TTS model testing and caption-to-speech video processing"
requires-python = ">=3.10"
dependencies = [
    "gradio>=5.25",
    "httpx",
    "numpy",
    "pandas",
    "soundfile",
    "torch>=2.0",
    "torchaudio>=2.0",
    "huggingface-hub",
    "scipy",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
f5tts = ["f5-tts", "pydub"]
dia = ["nari-tts @ git+https://github.com/nari-labs/dia.git"]
kokoro = ["kokoro>=0.9.4"]
orpheus = ["orpheus-speech"]
sparktts = ["einops", "einx", "omegaconf", "transformers>=4.46", "soxr", "safetensors"]
chatterbox = ["chatterbox-tts", "setuptools<81"]
qwen3tts = ["qwen-tts"]
outetts = ["outetts"]
zonos = ["zonos @ git+https://github.com/Zyphra/Zonos.git"]
sesame-csm = ["csm @ git+https://github.com/SesameAILabs/csm.git"]
tada = ["tada @ git+https://github.com/HumeAI/tada.git"]
piper = ["piper-tts"]
mcp = ["mcp>=1.0"]  # HTTP transport is in mcp core since 1.x (no 'http' extra)
# orpheus excluded: its vllm dependency pins transformers>=4.56 + torch==exact,
# which conflicts with outetts (transformers==4.52.3). Use a separate venv or
# a remote endpoint (endpoints.json) for Orpheus.
all = ["tts-studio[f5tts,dia,kokoro,sparktts,outetts]"]

[project.scripts]
tts-studio = "tts_tests.cli:main"

[tool.setuptools.packages.find]
include = ["tts_tests*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
