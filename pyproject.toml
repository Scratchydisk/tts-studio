[project]
name = "tts-studio"
version = "0.2.0"
description = "TTS model testing and caption-to-speech video processing"
requires-python = ">=3.10"
dependencies = [
    "gradio>=5.25",
    "numpy",
    "soundfile",
    "torch>=2.0",
    "torchaudio>=2.0",
    "huggingface-hub",
    "scipy",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
f5tts = ["f5-tts"]
dia = ["nari-tts @ git+https://github.com/nari-labs/dia.git"]
kokoro = ["kokoro>=0.9.4"]
orpheus = ["orpheus-speech"]
sparktts = ["einops", "omegaconf", "transformers>=4.46", "soxr", "safetensors"]
voxtral-local = ["vllm>=0.18.0", "vllm-omni @ git+https://github.com/vllm-project/vllm-omni.git", "mistral-common>=1.10.0"]
piper = ["piper-tts"]
all = ["tts-studio[f5tts,dia,kokoro,sparktts,orpheus]"]

[project.scripts]
tts-studio = "tts_tests.cli:main"

[tool.setuptools.packages.find]
include = ["tts_tests*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
